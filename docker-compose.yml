services:
  spectra:
    build: .
    container_name: spectra
    ports:
      - "${SPECTRA_PORT:-8085}:8080"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-local}
    volumes:
      - /root/spectra/data:/app/data
      - /root/spectra/inbox:/app/inbox
      - /root/spectra/processed:/app/processed
    restart: unless-stopped
